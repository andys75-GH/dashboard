<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leisure Electronics Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#11111b;color:#cdd6f4;font-family:'DM Sans',sans-serif}
button{cursor:pointer;font-family:inherit}
.tb{border:1px solid #313244;border-radius:8px;padding:7px 14px;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;background:none;color:#6c7086;transition:all .15s}
.tb:hover{border-color:#585b70;color:#cdd6f4}
.tb.active{background:#313244;border-color:#45475a;color:#cdd6f4}
.tb.alert{border-color:#f59e0b;color:#fbbf24;box-shadow:0 0 8px 1px rgba(245,158,11,0.35)}
.badge{margin-left:5px;background:#f59e0b;color:#11111b;border-radius:10px;font-size:10px;font-weight:700;padding:1px 5px;vertical-align:middle}
.card{background:#1e1e2e;border:1px solid #313244;border-radius:12px;overflow:hidden;margin-bottom:16px}
.card-header{padding:14px 20px;border-bottom:1px solid #313244;display:flex;align-items:center;justify-content:space-between}
.card-title{margin:0;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#cdd6f4}
.card-sub{margin:2px 0 0;font-family:'DM Mono',monospace;font-size:11px;color:#6c7086}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:'DM Mono',monospace}
th{padding:8px 12px;text-align:left;color:#6c7086;font-weight:500;background:#181825}
td{padding:8px 12px;border-top:1px solid #313244;color:#cdd6f4}
.mono{font-family:'DM Mono',monospace}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#181825}
::-webkit-scrollbar-thumb{background:#45475a;border-radius:3px}
#loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px}
.dot{width:10px;height:10px;border-radius:50%;background:#cba6f7;animation:pulse 1.2s ease-in-out infinite}
#app{max-width:1100px;margin:0 auto;padding:24px 16px}
.tab-content{display:none}.tab-content.active{display:block}
.alert-banner{border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.stat-pill{font-family:'Syne',monospace;font-weight:700;font-size:10px;padding:2px 7px;border-radius:4px;text-transform:uppercase;white-space:nowrap;color:#11111b}
.bar-bg{background:#313244;border-radius:3px;height:4px;margin-top:6px}
.bar-fill{border-radius:3px;height:4px;transition:width .3s}
.metric-card{background:#1e1e2e;border:1px solid #313244;border-radius:10px;padding:12px 14px}
.metric-label{font-family:'DM Mono',monospace;font-size:10px;color:#6c7086;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px}
.metric-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin:0}
.metric-sub{font-family:'DM Mono',monospace;font-size:10px;color:#45475a;margin:4px 0 0}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.chart-placeholder{background:#1e1e2e;border:1px solid #313244;border-radius:12px;padding:20px;margin-bottom:16px;overflow-x:auto}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <p class="login-title">Leisure Electronics</p>
    <p class="login-sub">Operations Dashboard</p>
    <div class="login-level">
      <button class="level-btn active" id="btn-level1" onclick="selectLevel(1)">Full Access</button>
      <button class="level-btn" id="btn-level2" onclick="selectLevel(2)">Standard Access</button>
    </div>
    <input class="login-input" type="password" id="pin-input" placeholder="Enter PIN" maxlength="20" onkeydown="if(event.key==='Enter') attemptLogin()">
    <button class="login-btn" onclick="attemptLogin()">Sign In</button>
    <p class="login-error" id="login-error"></p>
  </div>
</div>

<div id="loading" style="display:none">
  <div style="display:flex;gap:6px">
    <div class="dot" style="animation-delay:0s"></div>
    <div class="dot" style="animation-delay:.2s"></div>
    <div class="dot" style="animation-delay:.4s"></div>
  </div>
  <p style="font-family:'Syne',sans-serif;color:#6c7086;font-size:14px">Loading dashboard...</p>
</div>

<div id="app" style="display:none">
  <!-- Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
      <h1 style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#cdd6f4;letter-spacing:-.02em">Leisure Electronics</h1>
      <p id="subtitle" style="font-family:'DM Mono',monospace;font-size:11px;color:#6c7086;margin:3px 0 0"></p>
    </div>
    <div id="tabs" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>

  <!-- Tab panels -->
  <div id="tab-chart" class="tab-content active"></div>
  <div id="tab-disconnects" class="tab-content"></div>
  <div id="tab-dbcorrupt" class="tab-content"></div>
  <div id="tab-fraud" class="tab-content"></div>
  <div id="tab-gtab" class="tab-content"></div>
  <div id="tab-diskspace" class="tab-content"></div>
  <div id="tab-appfigures" class="tab-content"></div>
  <div id="tab-log" class="tab-content"></div>
</div>

<script>
//    Helpers                                                                 
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') e.className = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else e.setAttribute(k, v);
  });
  children.flat().forEach(c => c != null && e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
  return e;
}

function fmt(iso) {
  return new Date(iso).toLocaleDateString('en-GB', {day:'2-digit',month:'short'});
}

function today() { return new Date().toISOString().slice(0,10); }

function getAcked(key) {
  try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; }
}
function setAcked(key, id, eventDate) {
  const acked = getAcked(key);
  acked[id] = eventDate || today();
  try { localStorage.setItem(key, JSON.stringify(acked)); } catch {}
}
function isAcked(key, id, eventDate) {
  const acked = getAcked(key);
  return acked[id] === (eventDate || today());
}

//    Alert helpers                                                           
function makeAlertBanner(bg, border, badge, text, btn, badgeLabel, title, detail, count, onAck) {
  const d = el('div', {className:'alert-banner', style:{background:bg, border:`1px solid ${border}`, marginBottom:'8px'}},
    el('span', {className:'stat-pill', style:{background:badge}}, badgeLabel),
    el('div', {style:{flex:'1', minWidth:'160px'}},
      el('span', {style:{color:text, fontFamily:"'Syne',sans-serif", fontWeight:'700', fontSize:'13px'}}, title),
      el('span', {style:{color:'#6c7086', fontFamily:"'DM Mono',monospace", fontSize:'12px', marginLeft:'10px'}}, detail)
    ),
    el('span', {style:{color:text, fontFamily:"'Syne',sans-serif", fontWeight:'800', fontSize:'20px'}}, String(count)),
    el('button', {
      style:{background:btn, border:`1px solid ${border}`, borderRadius:'6px', color:'#cdd6f4', fontFamily:"'Syne',sans-serif", fontWeight:'700', fontSize:'11px', padding:'5px 12px', whiteSpace:'nowrap'},
      onClick: onAck
    }, 'Acknowledge')
  );
  return d;
}

function warnBanner(title, detail, count, onAck) {
  return makeAlertBanner('#2a1f00','#f59e0b','#f59e0b','#fbbf24','#78520a','Alert',title,detail,count,onAck);
}
function critBanner(title, detail, count, onAck) {
  return makeAlertBanner('#2a0a0a','#f38ba8','#f38ba8','#f38ba8','#7a2030','Critical',title,detail,count,onAck);
}

//    Data loading                                                            
async function loadAll() {
  const files = ['stats','disconnects','dbcorrupt','fraud','gtab','diskspace','appfigures','gtab_merkur1'];
  const results = [];
  for (const f of files) {
    try {
      const r = await fetch(`data/${f}.json?_=${Date.now()}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${f}.json not found`);
      const text = await r.text();
      try {
        results.push(JSON.parse(text));
        console.log(`OK: ${f}.json (${text.length} bytes)`);
      } catch(parseErr) {
        // Find the approximate location of the error
        const pos = parseInt(parseErr.message.match(/position (\d+)/)?.[1] || '0');
        const snippet = text.slice(Math.max(0,pos-30), pos+30);
        throw new Error(`JSON error in ${f}.json at position ${pos}: ...${snippet}...`);
      }
    } catch(e) {
      throw new Error(e.message);
    }
  }
  return { stats: results[0], disconnects: results[1], dbcorrupt: results[2], fraud: results[3], gtab: results[4], diskspace: results[5], appfigures: results[6], gtab_merkur1: results[7] };
}

//    Alert logic                                                             
function detectStatsAlerts(entries) {
  // Only check last 30 days for alerts - historical data shouldn't trigger
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  const sorted = [...entries].filter(e => new Date(e.date) >= cutoff).sort((a,b) => a.date.localeCompare(b.date));
  const alerts = [];
  let rs=0, rss=null;
  for (const e of sorted) {
    if ((e.itemsToBeReturned||0) > 100) { if(!rs) rss=e.date; rs++; if(rs>=3) alerts.push({id:'return-streak',level:rs>=5?'critical':'warning',title:'Items to Return elevated',detail:`Above 100 for ${rs} days (since ${fmt(rss)})`,val:e.itemsToBeReturned}); }
    else { rs=0; rss=null; }
  }
  let os=0, oss=null;
  for (const e of sorted) {
    if ((e.bookedOutToday||0) > 25) { if(!os) oss=e.date; os++; if(os>=3) alerts.push({id:'bookout-streak',level:os>=5?'critical':'warning',title:'High daily bookings out',detail:`Above 25 for ${os} days (since ${fmt(oss)})`,val:e.bookedOutToday}); }
    else { os=0; oss=null; }
  }
  const seen=new Set(); return alerts.filter(a=>{ if(seen.has(a.id)) return false; seen.add(a.id); return true; }).reverse();
}

function getDisconnectStreaks(reports) {
  const sorted=[...reports].sort((a,b)=>a.date.localeCompare(b.date));
  const allDates=sorted.map(r=>r.date), streaks={};
  for (const r of sorted) for (const s of r.sites) {
    if (!streaks[s.id]) streaks[s.id]={name:s.name,flag:s.flag,streak:1,lastDate:r.date,startDate:r.date};
    else {
      const li=allDates.indexOf(streaks[s.id].lastDate), ci=allDates.indexOf(r.date);
      if(ci===li+1){streaks[s.id].streak++;streaks[s.id].lastDate=r.date;streaks[s.id].flag=s.flag;}
      else streaks[s.id]={name:s.name,flag:s.flag,streak:1,lastDate:r.date,startDate:r.date};
    }
  }
  return streaks;
}

function getDbCounts(emails) {
  const ref=new Date(today()), cutoff=new Date(ref);
  cutoff.setDate(cutoff.getDate()-30);
  const counts={};
  for (const e of emails) {
    const d=new Date(e.date);
    if(d>=cutoff&&d<=ref){ if(!counts[e.site]) counts[e.site]={count:0,dates:[]}; counts[e.site].count++; if(!counts[e.site].dates.includes(e.date)) counts[e.site].dates.push(e.date); }
  }
  return counts;
}

function getFraudAlerts(emails) {
  const bysite={};
  for (const e of [...emails].sort((a,b)=>a.date.localeCompare(b.date))) { if(!bysite[e.site]) bysite[e.site]=[]; bysite[e.site].push(e.date); }
  const triggered={};
  const sevenDaysAgo=new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate()-7);
  for (const [site,dates] of Object.entries(bysite)) {
    const lastDate=new Date(dates[dates.length-1]);
    if(lastDate<sevenDaysAgo) continue;
    for (let i=0;i<dates.length;i++) {
      const ws=new Date(dates[i]),we=new Date(dates[i]); we.setDate(we.getDate()+7);
      const inW=dates.filter(d=>{const dd=new Date(d);return dd>=ws&&dd<=we;});
      if(inW.length>=2&&(!triggered[site]||triggered[site].count<inW.length)) triggered[site]={count:inW.length,dates:inW,first:inW[0],last:inW[inW.length-1]};
    }
  }
  return triggered;
}

function getGtabAlerts(reports) {
  const sorted=[...reports].sort((a,b)=>a.date.localeCompare(b.date));
  const latest=sorted[sorted.length-1];
  const halfAlerts=[], streakAlerts=[], posDays={}, dates=sorted.map(r=>r.date);
  if(latest) for(const s of latest.sites){ if(s.noData) continue; const p=s.installed>0?s.inactive/s.installed:0; if(p>=0.5) halfAlerts.push({...s,pct:Math.round(p*100)}); }
  for(const r of sorted) for(const s of r.sites){ if(s.noData) continue; for(const pos of s.positions){ const k=`${s.id}:${pos}`; if(!posDays[k]) posDays[k]={name:s.name,id:s.id,pos,dates:[]}; posDays[k].dates.push(r.date); } }
  for(const [,info] of Object.entries(posDays)){
    const ds=[...new Set(info.dates)].sort(); let streak=1,ss=ds[0];
    for(let i=1;i<ds.length;i++){ const pi=dates.indexOf(ds[i-1]),ci=dates.indexOf(ds[i]); if(ci===pi+1){streak++;if(streak>=13){const ex=streakAlerts.findIndex(a=>a.id===info.id&&a.pos===info.pos);if(ex>=0)streakAlerts[ex]={id:info.id,name:info.name,pos:info.pos,days:streak,since:ss,lastDate:ds[i]};else streakAlerts.push({id:info.id,name:info.name,pos:info.pos,days:streak,since:ss,lastDate:ds[i]});}}else{streak=1;ss=ds[i];} }
  }
  return {halfAlerts:halfAlerts.sort((a,b)=>b.pct-a.pct),streakAlerts,latest};
}

//    Tabs                                                                    
function switchTab(id) {
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelectorAll('#tabs .tb').forEach(b=>{ b.classList.toggle('active', b.dataset.tab===id); b.classList.toggle('alert', b.dataset.tab!==id && b.dataset.hasAlert==='1'); });
}

function buildTabs(alertCounts) {
  const tabs=[['chart','Charts'],['disconnects','Disconnects'],['dbcorrupt','DB Corrupt'],['fraud','Fraud'],['gtab','GTab'],['diskspace','Disk Space'],...(isLevel1()?[['appfigures','App Figures']]:[]),['log','Log']];
  const container=document.getElementById('tabs'); container.innerHTML='';
  tabs.forEach(([id,label])=>{
    const count=alertCounts[id]||0, hasAlert=count>0;
    const b=el('button',{className:'tb'+(id==='chart'?' active':'')+(hasAlert?' alert':''),'data-tab':id,'data-has-alert':hasAlert?'1':'0',onClick:()=>switchTab(id)}, label);
    if(hasAlert) b.appendChild(el('span',{className:'badge'},String(count)));
    container.appendChild(b);
  });
}

//    Charts Tab                                                              
function filterByRange(entries, range) {
    if (range === 'all') return entries;
    const now = new Date(), cutoff = new Date(now);
    if (range === '7d') cutoff.setDate(now.getDate()-7);
    else if (range === '30d') cutoff.setDate(now.getDate()-30);
    else if (range === '90d') cutoff.setDate(now.getDate()-90);
    return entries.filter(e => new Date(e.date) >= cutoff);
  }

function buildChartsTab(stats) {
  const container=document.getElementById('tab-chart'); container.innerHTML='';
  const alerts=detectStatsAlerts(stats), acked=getAcked('alert-acks');
  const visible=alerts.filter(a=>!isAcked('alert-acks',a.id,a.id));
  if(visible.length){
    const wrap=el('div',{style:{marginBottom:'16px'}});
    visible.forEach(a=>{
      const banner=a.level==='critical'?critBanner(a.title,a.detail,a.val,()=>{setAcked('alert-acks',a.id,a.id);buildChartsTab(stats);buildTabs(computeAlertCounts(window._data));}):warnBanner(a.title,a.detail,a.val,()=>{setAcked('alert-acks',a.id,a.id);buildChartsTab(stats);buildTabs(computeAlertCounts(window._data));});
      wrap.appendChild(banner);
    });
    container.appendChild(wrap);
  }

  const latest=stats[stats.length-1];
  if(!latest){container.appendChild(el('p',{style:{color:'#6c7086',fontFamily:"'DM Mono',monospace"}},'No data available.')); return;}

  // Range buttons
  let currentRange='30d';
  const rangeBtns=el('div',{style:{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}});
  [['7d','7 Days'],['30d','30 Days'],['90d','90 Days'],['all','All']].forEach(([r,label])=>{
    const b=el('button',{className:'tb'+(r==='30d'?' active':''),onClick:()=>{
      currentRange=r;
      rangeBtns.querySelectorAll('.tb').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      rebuildChart();
    }},label);
    rangeBtns.appendChild(b);
  });
  container.appendChild(rangeBtns);

  // Group buttons
  const groups={summary:['itemsToBeSent','itemsToBeReturned','bookedOutToday','bookedInToday'],calls:['callLogsTotal','callLogs_0_1w','callLogs_1_2w','engineerVisits'],tablets:['notSent','needsReturning','collectionArranged','returnChased']};
  const labels={itemsToBeSent:'Items to Send',itemsToBeReturned:'Items to Return',bookedOutToday:'Booked Out',bookedInToday:'Booked In',callLogsTotal:'Call Logs',callLogs_0_1w:'0-1 Weeks',callLogs_1_2w:'1-2 Weeks',engineerVisits:'Engineer Visits',notSent:'Not Sent',needsReturning:'Needs Returning',collectionArranged:'Collection Arranged',returnChased:'Return Chased'};
  const colors={itemsToBeSent:'#22c55e',itemsToBeReturned:'#84cc16',bookedOutToday:'#eab308',bookedInToday:'#f59e0b',callLogsTotal:'#f97316',callLogs_0_1w:'#fb923c',callLogs_1_2w:'#fdba74',engineerVisits:'#c2410c',notSent:'#3b82f6',needsReturning:'#6366f1',collectionArranged:'#8b5cf6',returnChased:'#14b8a6'};
  const groupBtns=el('div',{style:{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}});
  const metricsGrid=el('div',{className:'metrics-grid'});

  function renderGroup(g){
    metricsGrid.innerHTML='';
    groupBtns.querySelectorAll('.tb').forEach(b=>b.classList.toggle('active',b.dataset.g===g));
    groups[g].forEach(key=>{
      const vals=stats.map(e=>e[key]).filter(v=>v!=null);
      const avg=vals.length?Math.round(vals.reduce((s,v)=>s+v,0)/vals.length):null;
      const max=vals.length?Math.max(...vals):null;
      metricsGrid.appendChild(el('div',{className:'metric-card'},
        el('p',{className:'metric-label'},labels[key]),
        el('p',{className:'metric-val',style:{color:colors[key]}},latest[key]!=null?String(latest[key]):'-'),
        avg!=null?el('p',{className:'metric-sub'},'avg '+avg+' / max '+max):null
      ));
    });
  }

  [['summary',"Today's Summary"],['calls','Call Logs'],['tablets','Tablets']].forEach(([g,label])=>{
    const b=el('button',{className:'tb'+(g==='summary'?' active':''),'data-g':g,onClick:()=>{
      groupBtns.querySelectorAll('.tb').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderGroup(g);
    }},label);
    groupBtns.appendChild(b);
  });
  container.appendChild(groupBtns);
  renderGroup('summary');
  container.appendChild(metricsGrid);

  // Chart
  const chartCard=el('div',{className:'chart-placeholder'});
  container.appendChild(chartCard);

  function rebuildChart(){
    chartCard.innerHTML='';
    const recent=filterByRange(stats,currentRange);
    const W=900,H=180,pad={t:10,r:10,b:30,l:40};
    const vals1=recent.map(e=>e.itemsToBeReturned||0),vals2=recent.map(e=>e.itemsToBeSent||0);
    const maxV=Math.max(...vals1,...vals2,1);
    const xS=i=>(pad.l+(i/(recent.length-1||1))*(W-pad.l-pad.r));
    const yS=v=>(H-pad.b-(v/maxV)*(H-pad.t-pad.b));
    let p1='',p2='';
    recent.forEach((e,i)=>{p1+=(i===0?'M':'L')+xS(i)+','+yS(vals1[i]);p2+=(i===0?'M':'L')+xS(i)+','+yS(vals2[i]);});
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('style','width:100%;max-width:900px;display:block');
    [0,.25,.5,.75,1].forEach(t=>{
      const y=yS(maxV*t);
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',pad.l);line.setAttribute('y1',y);line.setAttribute('x2',W-pad.r);line.setAttribute('y2',y);
      line.setAttribute('stroke','#313244');line.setAttribute('stroke-dasharray','3,3');svg.appendChild(line);
      const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',pad.l-4);txt.setAttribute('y',y+4);txt.setAttribute('text-anchor','end');
      txt.setAttribute('fill','#6c7086');txt.setAttribute('font-size','9');
      txt.textContent=Math.round(maxV*t);svg.appendChild(txt);
    });
    recent.forEach((e,i)=>{if(i%5===0){const txt=document.createElementNS('http://www.w3.org/2000/svg','text');txt.setAttribute('x',xS(i));txt.setAttribute('y',H-pad.b+14);txt.setAttribute('text-anchor','middle');txt.setAttribute('fill','#6c7086');txt.setAttribute('font-size','9');txt.textContent=fmt(e.date);svg.appendChild(txt);}});
    const mkP=(d,s)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('stroke',s);p.setAttribute('stroke-width','2');p.setAttribute('fill','none');svg.appendChild(p);};
    mkP(p1,'#84cc16');mkP(p2,'#22c55e');
    chartCard.appendChild(svg);
    const leg=el('div',{style:{display:'flex',gap:'16px',marginTop:'8px',fontSize:'11px',fontFamily:"'DM Mono',monospace",color:'#6c7086'}},
      el('span',null,el('span',{style:{color:'#84cc16'}},'-- '),'Items to Return'),
      el('span',null,el('span',{style:{color:'#22c55e'}},'-- '),'Items to Send')
    );
    chartCard.appendChild(leg);
  }

function computeAlertCounts(data) {
  const t=today();
  const statsAcked=getAcked('alert-acks');
  const discAcked=getAcked('disconnect-acks');
  const dbAcked=getAcked('dbcorrupt-acks');
  const fraudAcked=getAcked('fraud-acks');
  const gtabAcked=getAcked('gtab-acks');

  const statsAlerts=detectStatsAlerts(data.stats).filter(a=>!isAcked('alert-acks',a.id,a.id)).length;
  const streaks=getDisconnectStreaks(data.disconnects);
  const latestDisc=[...data.disconnects].sort((a,b)=>b.date.localeCompare(a.date))[0];
  const discAlerts=Object.entries(streaks).filter(([id,s])=>s.streak>=3&&s.lastDate===latestDisc?.date&&!isAcked('disconnect-acks',id,s.lastDate)).length;
  const dbCounts=getDbCounts(data.dbcorrupt);
  const dbAlerts=Object.entries(dbCounts).filter(([site,v])=>v.count>3&&!isAcked('dbcorrupt-acks',site,v.dates.sort().slice(-1)[0])).length;
  const fraudAlerts=Object.entries(getFraudAlerts(data.fraud)).filter(([site,v])=>!isAcked('fraud-acks',site,v.last)).length;
  const {halfAlerts,streakAlerts}=getGtabAlerts(data.gtab);
  const gtabAlerts=halfAlerts.filter(a=>!isAcked('gtab-acks',`half:${a.id}`,a.date)).length+streakAlerts.filter(a=>!isAcked('gtab-acks',`streak:${a.id}:${a.pos}`,a.lastDate)).length;
  const m1Res=getGtabAlerts(data.gtab_merkur1);
  const m1Alerts=m1Res.halfAlerts.filter(a=>!isAcked('gtab-merkur1-acks',`half:${a.id}`,a.date)).length+m1Res.streakAlerts.filter(a=>!isAcked('gtab-merkur1-acks',`streak:${a.id}:${a.pos}`,a.lastDate)).length;
  const totalGtabAlerts=gtabAlerts+m1Alerts;

  const diskAcked2=getAcked('diskspace-acks');
  const diskAlerts=(data.diskspace||[]).filter(a=>!isAcked('diskspace-acks',a.datetime,a.datetime)).length>0?1:0;
  return {chart:statsAlerts,disconnects:discAlerts,dbcorrupt:dbAlerts,fraud:fraudAlerts,gtab:totalGtabAlerts,diskspace:diskAlerts,log:0};
}

function buildAppFiguresTab(entries) {
  const container=document.getElementById('tab-appfigures');
  if(!container) return;

  if(!entries.length){

    ));
    return;
  }

  const latest=sorted[0];

  // Metric cards
  const metrics=[
    {key:'registered',label:'Registered',color:'#22c55e'},
    {key:'ftd',label:'FTD',color:'#84cc16'},
    {key:'ftdPct',label:'FTD %',color:'#eab308',suffix:'%'},
    {key:'awpProfit',label:'AWP Profit',color:'#f97316',prefix:'GBP'},
    {key:'bingoProfit',label:'Bingo Profit',color:'#6366f1',prefix:'GBP'},
    {key:'totalProfit',label:'Total Profit',color:'#cba6f7',prefix:'GBP'},
    {key:'totalPlayers',label:'Total Players',color:'#14b8a6'},

  const grid=el('div',{className:'metrics-grid',style:{marginBottom:'16px'}});
  metrics.forEach(m=>{
    const val=latest[m.key];
    const vals=entries.map(e=>e[m.key]).filter(v=>v!=null);
    const avg=vals.length?Math.round(vals.reduce((s,v)=>s+v,0)/vals.length*100)/100:null;
    const formatted=val==null?'-':(m.prefix==='GBP'?String.fromCharCode(163):'')+ (typeof val==='number'?val.toLocaleString('en-GB',{minimumFractionDigits:m.prefix?2:0,maximumFractionDigits:m.prefix?2:0}):val)+(m.suffix||'');
    const avgFormatted=avg==null?null:(m.prefix==='GBP'?String.fromCharCode(163):'')+ (avg.toLocaleString('en-GB',{minimumFractionDigits:m.prefix?2:0,maximumFractionDigits:m.prefix?2:0}))+(m.suffix||'');
    grid.appendChild(el('div',{className:'metric-card'},
      el('p',{className:'metric-label'},m.label),
      el('p',{className:'metric-val',style:{color:m.color}},formatted),
      avgFormatted?el('p',{className:'metric-sub'},'avg '+avgFormatted):null
    ));
  });
  container.appendChild(grid);

  // Weekly summary table
  function getWeekKey(date) {
    const d=new Date(date), day=d.getDay(), diff=d.getDate()-day+(day===0?-6:1);
    const mon=new Date(d.setDate(diff));
    return mon.toISOString().slice(0,10);
  }

  const weeks={};
  entries.forEach(e=>{
    const wk=getWeekKey(e.date);
    if(!weeks[wk]) weeks[wk]={weekStart:wk,registered:0,ftd:0,awpProfit:0,bingoProfit:0,totalProfit:0,totalPlayers:0,days:0};
    weeks[wk].registered+=(e.registered||0);
    weeks[wk].ftd+=(e.ftd||0);
    weeks[wk].awpProfit+=Math.round((e.awpProfit||0)*100)/100;
    weeks[wk].bingoProfit+=Math.round((e.bingoProfit||0)*100)/100;
    weeks[wk].totalProfit+=Math.round((e.totalProfit||0)*100)/100;
    weeks[wk].totalPlayers+=(e.totalPlayers||0);
    weeks[wk].days++;
  });
  const weekList=Object.values(weeks).sort((a,b)=>b.weekStart.localeCompare(a.weekStart)).slice(0,6);

  const weekCard=el('div',{className:'card',style:{marginBottom:'16px'}});

  const wtbl=el('table',null,el('thead',null,el('tr',null,
    ...['Week','Registered','FTD','FTD%','AWP Profit','Bingo Profit','Total Profit','Players'].map(h=>el('th',{style:{textAlign:h==='Week'?'left':'right'}},h))
  )));
  const wtbody=el('tbody');
  weekList.forEach(w=>{

    const mon=new Date(w.weekStart), sun=new Date(mon); sun.setDate(mon.getDate()+6);
    const label=fmt(w.weekStart)+' - '+fmt(sun.toISOString().slice(0,10));
    wtbody.appendChild(el('tr',null,
      el('td',{style:{color:'#6c7086',whiteSpace:'nowrap',fontSize:'11px'}},label+(w.days<7?' ('+w.days+'d)':'')),
      el('td',{style:{textAlign:'right',color:'#22c55e',fontWeight:'600'}},String(w.registered)),

      el('td',{style:{textAlign:'right',color:'#f97316'}},String.fromCharCode(163)+w.awpProfit.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')),

      el('td',{style:{textAlign:'right',color:'#cba6f7',fontWeight:'700'}},String.fromCharCode(163)+w.totalProfit.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')),
      el('td',{style:{textAlign:'right',color:'#14b8a6'}},String(w.totalPlayers))
    ));
  });
  wtbl.appendChild(wtbody);
  weekCard.appendChild(el('div',{style:{overflowX:'auto'}},wtbl));
  container.appendChild(weekCard);

  // SVG chart - Total Profit over time
  const chartCard=el('div',{className:'chart-placeholder',style:{marginBottom:'16px'}});
  chartCard.appendChild(el('p',{style:{fontFamily:"'Syne',sans-serif",fontSize:'13px',fontWeight:'700',color:'#a6adc8',marginBottom:'12px'}},'Total Profit / Registered (last 30 days)'));
  const recent=[...entries].sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);
  const W=900,H=180,pad={t:10,r:10,b:30,l:55};
  const profits=recent.map(e=>e.totalProfit||0);
  const regs=recent.map(e=>e.registered||0);
  const maxP=Math.max(...profits,1), maxR=Math.max(...regs,1);
  const xS=i=>(pad.l+(i/(recent.length-1||1))*(W-pad.l-pad.r));
  const yS=v=>(H-pad.b-(v/maxP)*(H-pad.t-pad.b));
  const yS2=v=>(H-pad.b-(v/maxR)*(H-pad.t-pad.b));
  let p1='',p2='';
  recent.forEach((e,i)=>{p1+=(i===0?'M':'L')+xS(i)+','+yS(profits[i]);p2+=(i===0?'M':'L')+xS(i)+','+yS2(regs[i]);});
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('style','width:100%;max-width:900px;display:block');
  [0,.25,.5,.75,1].forEach(t=>{
    const y=yS(maxP*t), line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',pad.l);line.setAttribute('y1',y);line.setAttribute('x2',W-pad.r);line.setAttribute('y2',y);
    line.setAttribute('stroke','#313244');line.setAttribute('stroke-dasharray','3,3');svg.appendChild(line);
    const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',pad.l-4);txt.setAttribute('y',y+4);txt.setAttribute('text-anchor','end');
    txt.setAttribute('fill','#6c7086');txt.setAttribute('font-size','9');
    txt.textContent=''+Math.round(maxP*t).toLocaleString();svg.appendChild(txt);
  });
  recent.forEach((e,i)=>{if(i%5===0){const txt=document.createElementNS('http://www.w3.org/2000/svg','text');txt.setAttribute('x',xS(i));txt.setAttribute('y',H-pad.b+14);txt.setAttribute('text-anchor','middle');txt.setAttribute('fill','#6c7086');txt.setAttribute('font-size','9');txt.textContent=fmt(e.date);svg.appendChild(txt);}});
  const mkP=(d,s)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('stroke',s);p.setAttribute('stroke-width','2');p.setAttribute('fill','none');svg.appendChild(p);};
  mkP(p1,'#cba6f7');mkP(p2,'#22c55e');
  chartCard.appendChild(svg);
  chartCard.appendChild(el('div',{style:{display:'flex',gap:'16px',marginTop:'8px',fontSize:'11px',fontFamily:"'DM Mono',monospace",color:'#6c7086'}},
    el('span',null,el('span',{style:{color:'#cba6f7'}},'-- '),'Total Profit'),
    el('span',null,el('span',{style:{color:'#22c55e'}},'-- '),'Registered')
  ));
  container.appendChild(chartCard);

  // Daily history table
  const histCard=el('div',{className:'card'});
  histCard.appendChild(el('div',{className:'card-header'},el('h2',{className:'card-title',style:{color:'#a6adc8'}},'Daily History ('+entries.length+' days)')));
  const htbl=el('table',null,el('thead',null,el('tr',null,
    ...['Date','Day','Registered','FTD','FTD%','AWP Profit','Bingo Profit','Total Profit','Players'].map(h=>el('th',{style:{textAlign:h==='Date'||h==='Day'?'left':'right'}},h))
  )));
  const htbody=el('tbody');
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  sorted.forEach(e=>{
    const dayName=days[new Date(e.date).getDay()];
    const ftdPct=e.registered>0?Math.round(e.ftd/e.registered*1000)/10:0;

      el('td',{style:{textAlign:'right',color:'#22c55e',fontWeight:'600'}},e.registered||'-'),
      el('td',{style:{textAlign:'right',color:'#84cc16',fontWeight:'600'}},e.ftd||'-'),
      el('td',{style:{textAlign:'right',color:'#eab308'}},ftdPct+'%'),

//  Login 
const PINS = { level1: '1234', level2: '5678' }; // Change these!
let currentLevel = 1;

function selectLevel(l) {
  currentLevel = l;
  document.getElementById('btn-level1').classList.toggle('active', l===1);
  document.getElementById('btn-level2').classList.toggle('active', l===2);
  document.getElementById('pin-input').value='';
  document.getElementById('login-error').textContent='';
}

function attemptLogin() {
  const pin = document.getElementById('pin-input').value;
  const errEl = document.getElementById('login-error');
  if (currentLevel===1 && pin===PINS.level1) {
    sessionStorage.setItem('access','level1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('loading').style.display='flex';
    boot();
  } else if (currentLevel===2 && pin===PINS.level2) {
    sessionStorage.setItem('access','level2');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('loading').style.display='flex';
    boot();
  } else {
    errEl.textContent='Incorrect PIN  please try again';
    document.getElementById('pin-input').value='';
  }
}

function getAccessLevel() {
  return sessionStorage.getItem('access') || 'none';
}

function isLevel1() { return getAccessLevel()==='level1'; }

async function boot() {
  let data;
  try {
    data = await loadAll();
  } catch(e) {
    document.getElementById('loading').innerHTML = `<p style="color:#f38ba8;font-family:'Syne',sans-serif;font-size:16px">Failed to load data</p><p style="color:#6c7086;font-family:'DM Mono',monospace;font-size:12px;margin-top:8px">${e.message}</p><p style="color:#6c7086;font-family:'DM Mono',monospace;font-size:11px;margin-top:16px">Make sure the data/ folder is uploaded to GitHub.</p>`;
    return;
  }

  window._data = data;

  // Build all tabs
  buildChartsTab(data.stats);
  buildDisconnectsTab(data.disconnects);
  buildDbCorruptTab(data.dbcorrupt);
  buildFraudTab(data.fraud);
  buildGtabTab(data.gtab, data.gtab_merkur1);
  buildDiskSpaceTab(data.diskspace);
  buildAppFiguresTab(data.appfigures);
  buildLogTab(data.stats);
  buildTabs(computeAlertCounts(data));

  // Update subtitle
  const now = new Date();
  document.getElementById('subtitle').textContent = `${data.stats.length} days of data   refreshed ${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;

  // Show app
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';

  // Auto-refresh every 5 minutes
  setInterval(async()=>{
    try {
      const fresh=await loadAll();
      window._data=fresh;
      buildChartsTab(fresh.stats);
      buildDisconnectsTab(fresh.disconnects);
      buildDbCorruptTab(fresh.dbcorrupt);
      buildFraudTab(fresh.fraud);
      buildGtabTab(fresh.gtab, fresh.gtab_merkur1);
      buildDiskSpaceTab(fresh.diskspace);
      buildAppFiguresTab(fresh.appfigures);
      buildGtabTab(fresh.gtab, fresh.gtab_merkur1);
      buildLogTab(fresh.stats);
      buildTabs(computeAlertCounts(fresh));
      document.getElementById('subtitle').textContent=`${fresh.stats.length} days of data   refreshed ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;
    } catch(e) { console.warn('Refresh failed:',e); }
  }, 5*60*1000);
}
